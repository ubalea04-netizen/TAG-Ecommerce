<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAG Auctions</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #1a1a2e; color: #ffffff; }
        .container { max-width: 800px; margin: 0 auto; background: #16213e; padding: 20px; border-radius: 8px; }
        h1 { color: #e94560; text-align: center; }
        .auction-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-top: 20px; }
        .auction-item { border: 1px solid #0f3460; padding: 15px; border-radius: 8px; background-color: #0f3460; text-align: center; }
        .timer { font-weight: bold; color: #e94560; margin: 10px 0; }
        .bid-btn { background-color: #e94560; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .bid-btn:disabled { background-color: #555555; cursor: not-allowed; }
        .bid-btn:hover:not(:disabled) { background-color: #d1334d; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TAG Auctions</h1>
        <div class="auction-grid" id="auction-grid">
            <!-- Items will be injected here by JavaScript -->
        </div>
    </div>

    <script>
        const items = [
            { id: 1, name: "iPhone 15", price: 10, timeLeft: 30 },
            { id: 2, name: "MacBook Air M2", price: 50, timeLeft: 60 },
            { id: 3, name: "Sony WH-1000XM5", price: 15, timeLeft: 90 },
            { id: 4, name: "Apple Watch Series 9", price: 20, timeLeft: 120 }
        ];

        function renderItems() {
            const grid = document.getElementById("auction-grid");
            grid.innerHTML = "";

            items.forEach(item => {
                const itemCard = document.createElement("div");
                itemCard.className = "auction-item";
                itemCard.innerHTML = `
                    <h2>${item.name}</h2>
                    <p>Current Price: ₹<span id="price-${item.id}">${item.price}</span></p>
                    <p class="timer">Time Left: <span id="timer-${item.id}">${formatTime(item.timeLeft)}</span></p>
                    <button class="bid-btn" id="btn-${item.id}" onclick="placeBid(${item.id})">Bid +₹1</button>
                `;
                grid.appendChild(itemCard);
            });
        }

        function formatTime(seconds) {
            if (seconds <= 0) return "EXPIRED";
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function placeBid(id) {
            const item = items.find(i => i.id === id);
            if (item && item.timeLeft > 0) {
                item.price += 1;
                document.getElementById(`price-${id}`).innerText = item.price;
            }
        }

        setInterval(() => {
            items.forEach(item => {
                if (item.timeLeft > 0) {
                    item.timeLeft -= 1;
                    const timerElement = document.getElementById(`timer-${item.id}`);
                    if (timerElement) {
                        timerElement.innerText = formatTime(item.timeLeft);
                    }

                    if (item.timeLeft === 0) {
                        const btn = document.getElementById(`btn-${item.id}`);
                        if (btn) {
                            btn.disabled = true;
                            btn.innerText = "Auction Ended";
                        }
                    }
                }
            });
        }, 1000);

        renderItems();
    </script>
</body>
</html>
