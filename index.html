<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAG Auctions</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #1a1a2e; color: #ffffff; }
        .container { max-width: 900px; margin: 0 auto; background: #16213e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        h1 { color: #e94560; text-align: center; margin-top: 0; letter-spacing: 1px; }
        .user-section { background-color: #0f3460; padding: 15px; border-radius: 8px; margin-bottom: 25px; text-align: center; display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
        .user-section input { padding: 8px 12px; border-radius: 6px; border: 1px solid #16213e; outline: none; background: #1a1a2e; color: #fff; }
        .user-section button { background-color: #e94560; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .user-section button:hover { background-color: #d1334d; }
        .auction-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        .auction-item { border: 1px solid #1f4287; padding: 15px; border-radius: 10px; background-color: #0f3460; text-align: center; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
        .badge { position: absolute; top: 10px; right: 10px; padding: 4px 8px; border-radius: 4px; font-size: 0.75em; font-weight: bold; text-transform: uppercase; }
        .badge.active { background-color: #27ae60; color: white; }
        .badge.ended { background-color: #7f8c8d; color: white; }
        .item-img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; margin: 10px 0; background-color: #1a1a2e; }
        .item-title { margin: 5px 0; font-size: 1.2em; color: #fff; }
        .price-tag { font-size: 1.1em; color: #00fff0; font-weight: bold; margin: 5px 0; }
        .timer { font-weight: bold; color: #e94560; margin: 8px 0; background: rgba(233, 69, 96, 0.1); padding: 5px; border-radius: 4px; }
        .bid-btn { background-color: #e94560; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; margin-top: 5px; }
        .bid-btn:disabled { background-color: #4a4e69; cursor: not-allowed; }
        .bid-btn:hover:not(:disabled) { background-color: #d1334d; }
        .bid-log { margin-top: 12px; text-align: left; background: #16213e; padding: 10px; border-radius: 6px; max-height: 90px; overflow-y: auto; font-size: 0.8em; }
        .bid-log h4 { margin: 0 0 5px 0; color: #888; text-transform: uppercase; font-size: 0.75em; }
        .bid-log ul { list-style-type: none; padding-left: 0; margin: 0; }
        .bid-log li { margin-bottom: 3px; color: #bbb; border-bottom: 1px solid #222d4a; padding-bottom: 2px; }
        .reset-btn { display: block; margin: 25px auto 0; background-color: transparent; color: #e94560; border: 1px solid #e94560; padding: 8px 16px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .reset-btn:hover { background-color: #e94560; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TAG AUCTIONS</h1>

        <!-- User Identity Section -->
        <div class="user-section">
            <span id="user-display">Bidding as: <strong id="username-text">Guest</strong></span>
            <div id="username-form">
                <input type="text" id="username-input" placeholder="Enter username">
                <button onclick="saveUsername()">Set Name</button>
            </div>
        </div>

        <div class="auction-grid" id="auction-grid">
            <!-- Items will be injected here by JavaScript -->
        </div>

        <button class="reset-btn" onclick="resetBids()">Reset All Bids & Data</button>
    </div>

    <script>
        const initialItems = [
            { id: 1, name: "iPhone 15", price: 10, timeLeft: 300, image: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=400", logs: [] },
            { id: 2, name: "MacBook Air M2", price: 50, timeLeft: 600, image: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=400", logs: [] },
            { id: 3, name: "Sony WH-1000XM5", price: 15, timeLeft: 900, image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400", logs: [] },
            { id: 4, name: "Apple Watch Series 9", price: 20, timeLeft: 1200, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400", logs: [] }
        ];

        let currentUser = localStorage.getItem("tag_username") || "Guest";
        let items = JSON.parse(localStorage.getItem("tag_auction_items")) || initialItems;

        function initUser() {
            document.getElementById("username-text").innerText = currentUser;
        }

        function saveUsername() {
            const input = document.getElementById("username-input");
            if (input.value.trim() !== "") {
                currentUser = input.value.trim();
                localStorage.setItem("tag_username", currentUser);
                document.getElementById("username-text").innerText = currentUser;
                input.value = "";
            }
        }

        function saveToStorage() {
            localStorage.setItem("tag_auction_items", JSON.stringify(items));
        }

        function renderItems() {
            const grid = document.getElementById("auction-grid");
            grid.innerHTML = "";

            items.forEach(item => {
                const itemCard = document.createElement("div");
                itemCard.className = "auction-item";
                
                const isEnded = item.timeLeft <= 0;
                const logList = item.logs.map(log => `<li><strong>${log.user}</strong>: ₹${log.amount} <span style="color:#666">(${log.time})</span></li>`).join("");

                itemCard.innerHTML = `
                    <span class="badge ${isEnded ? 'ended' : 'active'}">${isEnded ? 'Ended' : 'Live'}</span>
                    <img src="${item.image}" alt="${item.name}" class="item-img">
                    <h3 class="item-title">${item.name}</h3>
                    <p class="price-tag">Current Bid: ₹<span id="price-${item.id}">${item.price}</span></p>
                    <p class="timer">Time Left: <span id="timer-${item.id}">${formatTime(item.timeLeft)}</span></p>
                    <button class="bid-btn" id="btn-${item.id}" onclick="placeBid(${item.id})" ${isEnded ? "disabled" : ""}>
                        ${isEnded ? "Auction Ended" : "Place Bid (+₹1)"}
                    </button>
                    <div class="bid-log">
                        <h4>Recent Activity</h4>
                        <ul id="log-${item.id}">${logList || "<li>No bids placed yet</li>"}</ul>
                    </div>
                `;
                grid.appendChild(itemCard);
            });
        }

        function formatTime(seconds) {
            if (seconds <= 0) return "EXPIRED";
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function placeBid(id) {
            const item = items.find(i => i.id === id);
            if (item && item.timeLeft > 0) {
                item.price += 1;
                const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                
                item.logs.unshift({ user: currentUser, amount: item.price, time: timeString });
                if (item.logs.length > 5) item.logs.pop();

                saveToStorage();
                renderItems();
            }
        }

        function resetBids() {
            localStorage.removeItem("tag_auction_items");
            items = JSON.parse(JSON.stringify(initialItems));
            renderItems();
        }

        setInterval(() => {
            items.forEach(item => {
                if (item.timeLeft > 0) {
                    item.timeLeft -= 1;
                    const timerElement = document.getElementById(`timer-${item.id}`);
                    if (timerElement) {
                        timerElement.innerText = formatTime(item.timeLeft);
                    }

                    if (item.timeLeft === 0) {
                        renderItems(); // Re-render to show "Ended" badge and update button state
                    }
                }
            });
            saveToStorage();
        }, 1000);

        initUser();
        renderItems();
    </script>
</body>
</html>
