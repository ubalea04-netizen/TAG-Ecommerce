<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAG Auctions</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #1a1a2e; color: #ffffff; }
        .container { max-width: 600px; margin: 0 auto; background: #16213e; padding: 20px; border-radius: 8px; }
        h1 { color: #e94560; }
        .auction-item { border: 1px solid #0f3460; padding: 15px; border-radius: 5px; margin-top: 15px; }
        .bid-btn { background-color: #e94560; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TAG Auctions</h1>
        <div class="auction-item">
            <h2>iPhone 15</h2>
            <p>Start Price: ₹10</p>
            <button class="bid-btn">Bid ₹1</button>
        </div>
    </div>
</body>
</html>
